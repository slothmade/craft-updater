name: Release

# Started by hand: Actions -> Release -> Run workflow -> enter the version (e.g. 5.8).
# Runs all checks, builds the ZIP and SHA256SUMS and creates a DRAFT release.
# Nothing is public until you open the draft and click "Publish release".

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 5.8 (must match the script and the package folder)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VERSION -notmatch '^\d+\.\d+(\.\d+)?$') { throw 'The version must look like 5.8 or 5.8.1.' }
          $folder = "Craft-Updater-v$($env:VERSION)-Portable"
          if (-not (Test-Path -LiteralPath $folder -PathType Container)) { throw "Package folder $folder not found." }
          $script = Join-Path $folder "Craft-Auto-Updater-v$($env:VERSION)-Portable.ps1"
          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) { throw "Script $script not found." }
          $text = [IO.File]::ReadAllText((Resolve-Path $script))
          if ($text -notmatch ('(?m)^\$UpdaterVersion = ''' + [regex]::Escape($env:VERSION) + '''')) { throw 'UpdaterVersion in the script does not match the version.' }
          foreach ($asset in @('assets/Craft-Updater.ico','assets/Craft-Updater-Header.png')) {
            if (-not (Test-Path -LiteralPath (Join-Path $folder $asset) -PathType Leaf)) { throw "Picture $asset is missing in $folder." }
          }
          $launcher = [IO.File]::ReadAllText((Resolve-Path (Join-Path $folder 'Craft-Updater-STARTEN.cmd')))
          if (-not $launcher.Contains("Craft-Auto-Updater-v$($env:VERSION)-Portable.ps1")) { throw 'The launcher does not start this version.' }
          $tag = "v$($env:VERSION)"
          $existing = @(gh release list --limit 1000 --json tagName | ConvertFrom-Json | Where-Object { $_.tagName -eq $tag })
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the existing releases.' }
          if ($existing.Count -gt 0) { throw "A release $tag already exists (maybe as a draft)." }
          Write-Host "Version $($env:VERSION) is consistent."

      - name: Run the offline tests
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\Craft-Updater-Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed - no release was created.' }

      - name: Build the ZIP and SHA256SUMS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $folder = "Craft-Updater-v$($env:VERSION)-Portable"
          $out = Join-Path $pwd 'release-assets'
          [void](New-Item -ItemType Directory -Path $out -Force)
          $zip = Join-Path $out "$folder.zip"
          # Entries are added one by one with forward slashes: ZipFile.CreateFromDirectory in
          # Windows PowerShell 5.1 writes backslashes, which the ZIP standard does not allow.
          $base = (Resolve-Path $folder).Path
          $archive = [IO.Compression.ZipFile]::Open($zip, [IO.Compression.ZipArchiveMode]::Create)
          try {
            foreach ($file in @(Get-ChildItem -LiteralPath $base -Recurse -File | Sort-Object FullName)) {
              $entryName = $folder + '/' + $file.FullName.Substring($base.Length).TrimStart([char[]]'\/').Replace('\','/')
              [void][IO.Compression.ZipFileExtensions]::CreateEntryFromFile($archive, $file.FullName, $entryName, [IO.Compression.CompressionLevel]::Optimal)
            }
          } finally { $archive.Dispose() }
          $check = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $bad = @($check.Entries | Where-Object { $_.FullName.Contains('\') -or -not $_.FullName.StartsWith($folder + '/') })
            if ($bad.Count -gt 0 -or $check.Entries.Count -eq 0) { throw 'The ZIP has wrong entry names.' }
            Write-Host ("ZIP entries: " + (($check.Entries | ForEach-Object FullName) -join ', '))
          } finally { $check.Dispose() }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          [IO.File]::WriteAllText((Join-Path $out 'SHA256SUMS'), ("{0}  {1}`n" -f $hash, "$folder.zip"), [Text.UTF8Encoding]::new($false))
          Write-Host "SHA256 $folder.zip = $hash"
          # Release notes: the matching section from CHANGELOG.md plus how to verify the download.
          $lines = [IO.File]::ReadAllLines((Resolve-Path 'CHANGELOG.md'))
          $notes = New-Object System.Collections.Generic.List[string]
          $inside = $false
          foreach ($line in $lines) {
            if ($line -match '^## ') { if ($inside) { break }; if ($line -match ('^## ' + [regex]::Escape($env:VERSION) + '(\s|$)')) { $inside = $true; continue } }
            if ($inside) { $notes.Add($line) }
          }
          if ($notes.Count -eq 0) { throw "CHANGELOG.md has no section '## $($env:VERSION)'." }
          $notes.Add('')
          $notes.Add('### Download')
          $notes.Add('')
          $notes.Add('Download **' + "$folder.zip" + '** below and extract it. The "Source code" files are only for developers. / Lade **' + "$folder.zip" + '** herunter und entpacke sie. Die Dateien "Source code" sind nur f' + [char]0x00FC + 'r Entwickler.')
          $notes.Add('')
          $notes.Add('### Verify your download')
          $notes.Add('')
          $notes.Add('SHA-256 of ' + "$folder.zip" + ': ' + '`' + $hash + '`')
          $notes.Add('')
          $notes.Add('```powershell')
          $notes.Add("Get-FileHash .\$folder.zip -Algorithm SHA256")
          $notes.Add('```')
          $notes.Add('')
          $notes.Add('Craft Updater is not code-signed; please verify the download as shown above. Privacy: see the [README](https://github.com/' + $env:GH_REPO + '#privacy).')
          [IO.File]::WriteAllLines((Join-Path $pwd 'release-notes.md'), $notes, [Text.UTF8Encoding]::new($false))

      - name: Create the draft release
        shell: powershell
        run: |
          $tag = "v$($env:VERSION)"
          $folder = "Craft-Updater-v$($env:VERSION)-Portable"
          gh release create $tag "release-assets/$folder.zip" "release-assets/SHA256SUMS" --draft --target $env:GITHUB_SHA --title "Craft Updater $($env:VERSION)" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release.' }
          Write-Host "Draft release $tag created. Open the Releases page, check it and click 'Publish release'."
