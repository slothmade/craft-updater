name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Parse all PowerShell files
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { Write-Host ("{0}:{1} {2}" -f $f.Name, $e.Extent.StartLineNumber, $e.Message); $bad++ }
          }
          if ($bad -gt 0) { exit 1 }
          Write-Host 'All PowerShell files parse without errors.'

      - name: Code analysis (PSScriptAnalyzer)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
            Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -Scope CurrentUser
          }
          Import-Module PSScriptAnalyzer
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1)
          $results | Sort-Object Severity, ScriptName, Line | Format-Table Severity, RuleName, ScriptName, Line, Message -AutoSize -Wrap | Out-String -Width 220 | Write-Host
          $errors = @($results | Where-Object Severity -eq 'Error')
          Write-Host ("Findings: {0} (errors: {1})" -f $results.Count, $errors.Count)
          if ($errors.Count -gt 0) { exit 1 }

      - name: Offline tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\Craft-Updater-Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
